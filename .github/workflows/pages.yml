name: Publish student site

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep this independent of GitHub's generated branch-publishing queue.
concurrency:
  group: deep-ocean-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
